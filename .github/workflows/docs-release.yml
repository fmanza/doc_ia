name: Docs Release ZIP

# Triggered automatically on version tags (v*) and manually via workflow_dispatch.
# Builds the documentation site and uploads a ZIP to the GitHub Release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag / version to attach the ZIP to (e.g. v0.2.0)"
        required: false

concurrency:
  group: docs-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    name: Build docs ZIP & upload to release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create/update GitHub Releases

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs dependencies
        run: pip install -r requirements.txt

      - name: Build docs & create ZIP
        run: python scripts/build_docs_zip.py --builder mkdocs

      - name: Upload ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/doc_ia-docs-*.zip
          fail_on_unmatched_files: true
          # Creates the release if it doesn't exist yet (useful for workflow_dispatch).
          tag_name: ${{ github.ref_name }}
