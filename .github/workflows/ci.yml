name: ✅ CI — Calidad y trazabilidad

# Lint, tipos, tests, trazabilidad docs ↔ código y build estricto de la documentación.
# Sin docling/torch: requirements-dev.txt solo incluye el stack de MkDocs y las herramientas.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-*.txt

      - name: Instalar dependencias de desarrollo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: python -m ruff check scripts tests hooks

      - name: Ruff (formato)
        run: python -m ruff format --check scripts tests hooks

      - name: Mypy (strict)
        run: python -m mypy scripts

      - name: Pytest
        run: python -m pytest

      - name: Trazabilidad — drift (bloqueante)
        run: python scripts/doc_trace.py drift

      - name: Trazabilidad — criterios ↔ tests
        run: python scripts/doc_trace.py matrix --output traceability.md

      - name: Trazabilidad — llms.txt al día
        run: python scripts/doc_trace.py llms --check

      - name: Build estricto de la documentación
        run: python -m mkdocs build --strict

      # Paridad con Zensical (sucesor de Material for MkDocs). No bloqueante mientras Zensical
      # esté en alfa: build_docs_zip.py ejecuta los hooks que Zensical ignora y el ZIP latest
      # debe existir al terminar.
      - name: Build Zensical (paridad, no bloqueante)
        id: zensical
        continue-on-error: true
        run: |
          python scripts/build_docs_zip.py --builder zensical --output-dir "$RUNNER_TEMP/zdist"
          test -f site/doc_ia-docs-latest.zip
          test -f site/doc_ia-docs-latest.zip.sha256

      # Con continue-on-error el paso anterior figura como "success" aunque falle. El resultado real
      # se publica como anotación (legible por la API pública) para medir la condición C2 de ADR-003.
      - name: Resultado de la paridad Zensical
        if: always()
        run: |
          if [ "${{ steps.zensical.outcome }}" = "success" ]; then
            echo "::notice title=Paridad Zensical::OK (Python ${{ matrix.python-version }})"
          else
            echo "::warning title=Paridad Zensical::FALLO (Python ${{ matrix.python-version }}): ${{ steps.zensical.outcome }}"
          fi

  # `mkdocs build --strict` no valida Mermaid: el tema renderiza en el navegador. Este job pasa
  # cada página con diagramas por el parser real, con la versión mayor que carga cada tema
  # (Material → mermaid@11, Zensical → mermaid@12). Versiones exactas y con al menos dos semanas
  # de antigüedad; se usa el Node y el Chrome del runner (sin descarga de puppeteer).
  mermaid:
    name: Mermaid (parser real, mermaid ${{ matrix.mermaid }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cli: "11.17.0"
            mermaid: "11.17.2"
          - cli: "12.0.0"
            mermaid: "12.2.0"

    steps:
      - uses: actions/checkout@v7

      - name: Instalar mermaid-cli
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          mkdir -p "$RUNNER_TEMP/mmdc" && cd "$RUNNER_TEMP/mmdc"
          echo '{"private": true}' > package.json
          npm install --no-audit --no-fund --ignore-scripts \
            "@mermaid-js/mermaid-cli@${{ matrix.cli }}" "mermaid@${{ matrix.mermaid }}"
          npm ls mermaid
          echo '{"executablePath": "/usr/bin/google-chrome", "args": ["--no-sandbox"]}' > puppeteer.json

      - name: Validar los diagramas de docs/
        run: |
          mkdir -p "$RUNNER_TEMP/mmdc-out"
          status=0
          for page in $(grep -rl --include='*.md' '^```mermaid' docs); do
            out="$RUNNER_TEMP/mmdc-out/$(echo "$page" | tr / _)"
            if ! "$RUNNER_TEMP/mmdc/node_modules/.bin/mmdc" -q \
                -p "$RUNNER_TEMP/mmdc/puppeteer.json" -i "$page" -o "$out"; then
              echo "::error file=$page::Mermaid ${{ matrix.mermaid }} no parsea un diagrama de $page"
              status=1
            fi
          done
          exit $status
