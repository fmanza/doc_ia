name: 📦 Build & Publish Docs ZIP

on:
  push:
    branches:
      - main
    # Solo si hay cambios en docs/
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - '.github/workflows/docs-zip-release.yml'
  workflow_dispatch:  # Ejecutar manualmente desde GitHub UI

jobs:
  build-and-publish:
    name: Build Docs & Publish ZIP
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Para crear releases

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🏗️ Build documentation (MkDocs Material)
        run: |
          python -m mkdocs build --strict
          echo "✅ Documentation built successfully"

      - name: 📚 Generate ZIP + Checksums
        run: |
          python scripts/build_docs_zip.py --no-build
          echo "✅ ZIP and checksums generated"
          ls -lh dist/

      - name: 🔐 Display checksums for verification
        run: |
          echo "📋 CHECKSUMS.txt content:"
          cat dist/CHECKSUMS.txt || echo "No checksums file yet"
          echo ""
          echo "🔒 SHA256 file:"
          cat dist/*.sha256 || echo "No sha256 file yet"

      - name: 📤 Upload ZIP as artifact (retention: 30 days)
        uses: actions/upload-artifact@v4
        with:
          name: docs-zip-build
          path: dist/doc_ia-docs-*.zip*
          retention-days: 30

      - name: 📋 Extract version and prepare release
        id: release_info
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.loads(open('pyproject.toml').read())['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📌 Version: $VERSION"

          SHA256=$(cat dist/*.sha256 | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "🔐 SHA256: $SHA256"

      - name: 🏷️ Create or update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: "docs-v${{ steps.release_info.outputs.version }}"
          name: "📚 Documentation Offline v${{ steps.release_info.outputs.version }}"
          body: |
            ## 📚 Documentation Offline Package — doc_ia

            **Version**: ${{ steps.release_info.outputs.version }}
            **Date**: ${{ github.event.head_commit.timestamp }}
            **Commit**: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

            ### 📦 Contents

            - ✅ Complete HTML documentation with search
            - ✅ Mermaid diagrams (rendered)
            - ✅ Offline search capability
            - ✅ Responsive design (mobile-friendly)

            ### 🔐 Integrity Verification

            **SHA256**: `${{ steps.release_info.outputs.sha256 }}`

            ```bash
            sha256sum doc_ia-docs-*.zip
            # Compare the output with the SHA256 above
            ```

            ### 🚀 How to Use

            1. Download the ZIP file below
            2. Extract: `unzip doc_ia-docs-*.zip`
            3. Open `index.html` in your browser
            4. For offline search, serve the folder: `python -m http.server 8000`
          artifacts: dist/doc_ia-docs-*.zip,dist/*.sha256,dist/CHECKSUMS.txt
          draft: false
          prerelease: false
          allowUpdates: true
          replacesArtifacts: true

      - name: ✅ Release published successfully
        run: |
          echo "🎉 Release created/updated: docs-v${{ steps.release_info.outputs.version }}"

      - name: 📢 Notify on failure
        if: failure()
        run: |
          echo "❌ Build or release failed. Check the logs above."
          exit 1
