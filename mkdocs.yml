site_name: doc_ia
site_description: Documentación asistida por IA de proyectos de desarrollo
site_author: Paco Manzano
site_url: https://fmanza.github.io/doc_ia/
repo_url: https://github.com/fmanza/doc_ia
repo_name: fmanza/doc_ia
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github

hooks:
  - hooks/sync_root_docs.py
  - mkdocs_hooks.py

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [docs]
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Inicio: index.md
  - Quick Start: quickstart.md
  - Instalación: installation.md
  - 📥 Descargas: downloads.md

  # ── Audiencia: Product Owner, responsables de documentación ────────────────
  - Documentación Funcional:
      - Mapa Funcional: functional/index.md
      - Tooling Determinista:
          - Verificación de Entorno: functional/check_env.md
          - ZIP de Documentación Offline: functional/build_docs_zip.md
          - Conversión de Documentos a Markdown: functional/convert_to_md.md
          - Trazabilidad Docs ↔ Código: functional/doc_trace.md
      - Flujos IA:
          - Documentar un Proyecto: functional/document_project.md
          - Catálogo de Tipos de Origen: functional/origin_types.md
          - Arquetipos Formales: functional/archetypes.md
          - Bootstrap de Configuración IA: functional/bootstrap.md

  # ── Audiencia: Desarrolladores, mantenedores del proyecto ──────────────────
  - Referencia Técnica:
      - Flujos IA:
          - document_project: api/document_project.md
          - archetypes: api/archetypes.md
          - bootstrap: api/bootstrap.md
      - Tooling Determinista:
          - check_env: api/check_env.md
          - build_docs_zip: api/build_docs_zip.md
          - convert_to_md: api/convert_to_md.md
          - doc_trace: api/doc_trace.md

  # ── Audiencia: usuarios y operadores del tooling (Arquetipo 12) ───────────
  - Referencia del Sistema: reference/index.md

  # ── Ejemplos de código ─────────────────────────────────────────────────────
  - Ejemplos:
      - Flujos IA:
          - Documentar un Proyecto: examples/document_project_usage.md
          - Aplicar Arquetipos Individualmente: examples/archetypes_usage.md
          - Bootstrap de Configuración IA: examples/bootstrap_usage.md
      - Tooling Determinista:
          - Verificar Entorno: examples/check_env_usage.md
          - Generar ZIP Offline: examples/build_docs_zip_offline.md
          - Convertir Documentos a Markdown: examples/convert_to_md_usage.md
          - Trazabilidad Docs ↔ Código: examples/doc_trace_usage.md

  # ── Guías de uso y operación ───────────────────────────────────────────────
  - Guías:
      - Incorporación:
          - Onboarding de Desarrolladores: guides/onboarding_dev.md
      - Errores y Diagnóstico:
          - Troubleshooting: guides/troubleshooting.md
      - Herramientas IA:
          - Guía de Claude Code: guides/claude_code_guide.md
          - Guía de Codex (OpenAI): guides/codex_guide.md

  # ── Configuración de agentes IA ───────────────────────────────────────────
  - Configuración IA:
      - Claude Code: ai-config/claude.md

  # ── Contexto del proyecto ──────────────────────────────────────────────────
  - Arquitectura:
      - Visión del Sistema: architecture.md
      - ADR-001 — MkDocs Material por defecto: adr/ADR-001-mkdocs-material-por-defecto.md
      - ADR-002 — Arquetipos con evidencia verificable: adr/ADR-002-arquetipos-con-evidencia.md
      - ADR-003 — Zensical por defecto (propuesto): adr/ADR-003-zensical-por-defecto.md

  - Changelog: changelog.md
  - Contribuir: contributing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fmanza/doc_ia

# Mermaid lo renderiza la integración nativa del tema (pymdownx.superfences custom_fences) con la
# versión servida en local: el tema usa window.mermaid si existe y no descarga nada de unpkg.
# Orden obligatorio: la librería y después mermaid-theme.js. No añadir el CDN ni un
# mermaid.run() propio: duplica el render (ver EDGE_CASES § Mermaid).
extra_javascript:
  - assets/js/sidebar-toggle.js
  - assets/vendor/mermaid/mermaid-12.2.0.min.js
  - assets/js/mermaid-theme.js

extra_css:
  - assets/css/mermaid.css
  - assets/css/nav.css
