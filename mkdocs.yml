site_name: doc_ia
site_description: Documentación asistida por IA de proyectos de desarrollo
site_author: Paco Manzano
site_url: https://fmanza.github.io/doc_ia/
repo_url: https://github.com/fmanza/doc_ia
repo_name: fmanza/doc_ia
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [docs]
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Inicio: index.md
  - Instalación: installation.md
  - 📥 Descargas: downloads.md

  # ── Audiencia: Product Owner, responsables de documentación ────────────────
  - Documentación Funcional:
      - Tooling Determinista:
          - Verificación de Entorno: functional/check_env.md
          - ZIP de Documentación Offline: functional/build_docs_zip.md
      - Flujos IA:
          - Documentar un Proyecto: functional/document_project.md
          - Arquetipos Formales: functional/archetypes.md
          - Bootstrap de Configuración IA: functional/bootstrap.md

  # ── Audiencia: Desarrolladores, mantenedores del proyecto ──────────────────
  - Referencia Técnica:
      - Tooling Determinista:
          - check_env: api/check_env.md
          - build_docs_zip: api/build_docs_zip.md

  # ── Ejemplos de código ─────────────────────────────────────────────────────
  - Ejemplos:
      - Flujos IA:
          - Documentar un Proyecto: examples/document_project_usage.md
      - Tooling Determinista:
          - Verificar Entorno: examples/check_env_usage.md
          - Generar ZIP Offline: examples/build_docs_zip_offline.md

  # ── Guías de uso y operación ───────────────────────────────────────────────
  - Guías:
      - Incorporación:
          - Onboarding de Desarrolladores: guides/onboarding_dev.md
      - Errores y Diagnóstico:
          - Troubleshooting: guides/troubleshooting.md
      - Herramientas IA:
          - Guía de Codex (OpenAI): guides/codex_guide.md

  # ── Contexto del proyecto ──────────────────────────────────────────────────
  - Arquitectura:
      - Visión del Sistema: architecture.md
      - ADR-001 — MkDocs Material por defecto: adr/ADR-001-mkdocs-material-por-defecto.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fmanza/doc_ia

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - assets/js/mermaid.js
  - assets/js/sidebar-toggle.js

extra_css:
  - assets/css/mermaid.css
  - assets/css/nav.css
