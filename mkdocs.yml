site_name: doc_ia
site_description: Documentación asistida por IA de proyectos de desarrollo
site_url: ""
use_directory_urls: true

theme:
  name: material
  language: es
  features:
    - navigation.sections
    - navigation.top
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true

nav:
  - Inicio: index.md
  - Guías:
      - Herramientas IA:
          - Guía de Codex (OpenAI): guides/codex_guide.md
  - Descargas: downloads.md
