[project]
name = "doc_ia"
version = "0.1.0"
description = "Instrucciones IA y tooling determinista para documentar proyectos de desarrollo"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["scripts", "tests", "hooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
