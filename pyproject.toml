[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc_ia"
version = "0.1.0"
description = "Instrucciones IA y tooling determinista para documentar proyectos de desarrollo"
requires-python = ">=3.12"

[project.entry-points."mkdocs.plugins"]
doc_ia_documentation_zip = "doc_ia_docs.docs_build_plugin:DocumentationZipPlugin"

[tool.setuptools.packages.find]
include = ["doc_ia_docs*", "scripts*", "hooks*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["scripts", "tests", "hooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
