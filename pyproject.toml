[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc_ia"
version = "0.2.0"
description = "Instrucciones IA y tooling determinista para documentar proyectos de desarrollo"
requires-python = ">=3.12"

[project.optional-dependencies]
docling = ["docling>=2.100"]
markitdown = ["markitdown>=0.1"]
all-engines = ["docling>=2.100", "markitdown>=0.1"]

[tool.setuptools.packages.find]
include = ["scripts*", "hooks*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["scripts", "tests", "hooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["scripts"]

# docling y markitdown son extras opcionales ([docling], [markitdown]): sin ellos, mypy no
# encuentra sus módulos.
[[tool.mypy.overrides]]
module = ["docling", "docling.*", "markitdown", "markitdown.*"]
ignore_missing_imports = true

# Los `type: ignore` sobre APIs de docling solo se usan cuando docling está instalado;
# no avisar de ellos en entornos sin el extra (CI, venv mínimo).
[[tool.mypy.overrides]]
module = ["scripts.convert_to_md"]
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
